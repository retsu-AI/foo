name: Native tools
on:
  pull_request:
    paths:
      - 'src/platform/process/**'
      - 'src/tools/**'
      - 'src/contracts/**'
      - 'tests/platform-process/**'
      - 'tests/tools/**'
      - 'build.zig'
      - '.zig-version'
      - '.github/workflows/native-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Tools and process (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Debug
        run: |
          zig build test -Dmodule=tools
          zig build test -Dmodule=platform-process
      - name: ReleaseSafe
        run: |
          zig build test -Dmodule=tools -Doptimize=ReleaseSafe
          zig build test -Dmodule=platform-process -Doptimize=ReleaseSafe
