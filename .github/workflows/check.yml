name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
        id: zig
      - name: Check contracts
        run: |
          zig build check-bootstrap
          python .github/scripts/test-install-zig.py
      - name: Check portable suites
        run: |
          for module in wire core providers config; do
            zig build test -Dmodule="$module"
          done
      - name: Check documentation
        run: |
          python -m pip install -r .github/docs-requirements.txt
          python docs/plan/build.py --check
          python docs/plan/test_build.py
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.zig.outputs.global-cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/foo-zig-global
          key: ${{ steps.zig.outputs.global-cache-key }}
