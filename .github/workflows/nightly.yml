name: Nightly
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Set transport prefix
        shell: bash
        run: |
          echo "FOO_TRANSPORT_PREFIX=$RUNNER_TEMP/foo-transport" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/foo-transport/bin" >> "$GITHUB_PATH"
      - name: Build pinned transport libraries
        if: runner.os != 'Windows'
        run: python .github/scripts/build-transport.py "$FOO_TRANSPORT_PREFIX"
      - name: Build pinned transport libraries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          python .github/scripts/build-transport.py "%FOO_TRANSPORT_PREFIX%"
      - name: Check Debug
        run: |
          zig build check
          zig build
          python tests/contracts/bootstrap.py
      - name: Check ReleaseSafe
        run: |
          zig build check -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe
          python tests/contracts/bootstrap.py
  nix:
    name: Nix checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake and documentation
        run: |
          nix flake check
          nix develop .#ci -c python docs/plan/build.py --check
          nix develop .#ci -c python docs/plan/test_build.py
